# Local development only: a Postgres for building and checking the API on the
# laptop (ROADMAP 0.2-0.5). The lab's real stacks are deploy/sut and
# deploy/brain (ROADMAP 0.6). Port 5433, because 5432 is often taken locally.
name: stresslab-local

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
