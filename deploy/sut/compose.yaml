# The machine under test (ARCHITECTURE.md, "Step 0"): the Go API and Postgres.
# Host networking, so Docker's NAT never sits inside a measured request
# (SPEC, Runtime). Exporters and the log/profile collector arrive in ROADMAP 0.9.
#
#   docker compose up -d --wait postgres
#   docker compose run --rm seed build      # once: the template database
#   docker compose run --rm seed reset      # before every run: a fresh clone
#   docker compose up -d --wait api
#
# Secrets come from .env next to this file (see .env.example), never git.
# On the laptop, add -f compose.laptop.yaml: Docker Desktop can't do host networking.
name: stresslab-sut

services:
  postgres:
    image: postgres:18.6
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Docker's default 64 MB of shared memory is too small for Postgres
    # parallel queries; this is plumbing, not tuning (SPEC N1).
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    image: ghcr.io/adssib/stresslab-api:${TAG:-dev}
    build:
      context: ../..
      target: api
    network_mode: host
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@${DB_HOST:-127.0.0.1}:5432/stresslab
      STRESSLAB_TOKEN_KEY: ${STRESSLAB_TOKEN_KEY:?set STRESSLAB_TOKEN_KEY in .env}
    volumes:
      - ${CONFIG_FILE:-../../config.yaml}:/etc/stresslab/config.yaml:ro
    healthcheck:
      # distroless has no shell or curl; the API binary can't probe itself,
      # so readiness is checked from outside (`curl /healthz`).
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot tool, not a service: `docker compose run --rm seed build|reset|checksum`.
  seed:
    image: ghcr.io/adssib/stresslab-seed:${TAG:-dev}
    build:
      context: ../..
      target: seed
    network_mode: host
    environment:
      STRESSLAB_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@${DB_HOST:-127.0.0.1}:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]

volumes:
  pgdata:
